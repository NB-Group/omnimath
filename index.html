    <meta name="twitter:image" content="%BASE_URL%og.png" />
    <script>
      // Restore a deep link captured by 404.html (GitHub Pages SPA fallback).
      (function () {
        var BASE = '%BASE_URL%';
        var target = null;
        try { target = sessionStorage.getItem('omnimath:redirect'); } catch (e) {}
        if (!target) return;
        try { sessionStorage.removeItem('omnimath:redirect'); } catch (e) {}
        try {
          var url = new URL(target, location.origin);
          if (url.search.indexOf('?/') !== 0) return;
          var raw = decodeURIComponent(url.search.slice(2));
          var parts = raw.split('&');
          var path = parts.shift() || '';
          var query = parts.join('&');
          history.replaceState(null, '', BASE + path + (query ? '?' + query : '') + url.hash);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
